name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly regression run at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, smoke, api, ui]
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  # ── Smoke Tests — Run on every PR ─────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=api
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://reqres.in' }}
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Full Regression — Run on merge to main + nightly ──────────
  regression:
    name: Regression Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false   # Don't cancel other browsers if one fails
      matrix:
        project: [chromium, firefox, api]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project == 'api' && 'chromium' || matrix.project }}

      - name: Run tests — ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://example.com' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://reqres.in' }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CI: true

      - name: Upload results — ${{ matrix.project }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # ── Publish Report ─────────────────────────────────────────────
  publish-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: [regression]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: regression-results-*
          merge-multiple: true
          path: combined-results/

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: combined-results/playwright-report
          destination_dir: test-reports
